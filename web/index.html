<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Commit Muse</title>
<meta name="description" content="An agent that reads your day of commits every night and leaves a journal entry behind.">
<style>
  :root {
    --bg: #fbfaf7;
    --panel: #ffffff;
    --ink: #1b1a17;
    --muted: #6f6a60;
    --line: #e6e1d8;
    --accent: #b4552d;
    --accent-soft: #f5e9e2;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14130f;
      --panel: #1c1b16;
      --ink: #eeeae0;
      --muted: #9b948a;
      --line: #2e2c25;
      --accent: #e08a5c;
      --accent-soft: #2a221c;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 16px/1.75 ui-serif, Georgia, "Hiragino Mincho ProN", "Yu Mincho", serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 44rem; margin: 0 auto; padding: 3rem 1.25rem 6rem; }
  header { border-bottom: 1px solid var(--line); padding-bottom: 1.5rem; margin-bottom: 2.5rem; }
  h1 {
    font: 600 1.55rem/1.2 var(--mono);
    letter-spacing: -0.02em;
    margin: 0 0 .4rem;
  }
  h1 .dot { color: var(--accent); }
  .tag { color: var(--muted); font: 400 .84rem/1.6 var(--mono); margin: 0; }
  .bar { display: flex; gap: .5rem; align-items: center; margin-top: 1.25rem; flex-wrap: wrap; }
  button {
    font: 500 .78rem/1 var(--mono);
    padding: .5rem .75rem;
    border: 1px solid var(--line);
    background: var(--panel);
    color: var(--muted);
    border-radius: 999px;
    cursor: pointer;
    transition: .15s;
  }
  button:hover { color: var(--ink); border-color: var(--accent); }
  button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
  article {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 1.75rem;
    margin-bottom: 1.25rem;
  }
  article.today { border-color: var(--accent); box-shadow: 0 1px 0 var(--accent-soft), 0 12px 32px -24px rgba(0,0,0,.5); }
  .meta {
    display: flex; gap: .75rem; align-items: baseline; flex-wrap: wrap;
    font: 400 .76rem/1.4 var(--mono); color: var(--muted); margin-bottom: .6rem;
  }
  .meta .mood { color: var(--accent); }
  h2 { font: 600 1.3rem/1.35 ui-serif, Georgia, serif; margin: 0 0 .35rem; letter-spacing: -0.01em; }
  .headline { color: var(--muted); font-style: italic; margin: 0 0 1.1rem; }
  .journal { margin: 0; white-space: pre-wrap; }
  .tags { margin-top: 1.1rem; display: flex; gap: .4rem; flex-wrap: wrap; }
  .tags span { font: 400 .72rem/1 var(--mono); color: var(--muted); border: 1px solid var(--line); border-radius: 999px; padding: .35rem .6rem; }
  .vote { margin-top: 1.25rem; padding-top: 1.1rem; border-top: 1px dashed var(--line); display: flex; gap: .5rem; align-items: center; flex-wrap: wrap; }
  .vote .prefs { display: flex; gap: .4rem; flex-wrap: wrap; }
  .vote .prefs button { font-size: .72rem; padding: .4rem .6rem; }
  .vote .label { font: 400 .72rem/1.4 var(--mono); color: var(--muted); width: 100%; }
  .vote .said { font: 400 .76rem/1.4 var(--mono); color: var(--accent); }
  .empty, .error { color: var(--muted); font: 400 .9rem/1.7 var(--mono); }
  footer { margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--line); color: var(--muted); font: 400 .78rem/1.7 var(--mono); }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>commit muse<span class="dot">.</span></h1>
    <p class="tag">An agent reads the day's commits at 22:00 JST and leaves this behind.<br>There is no generate button. There never was.</p>
    <div class="bar">
      <button id="lang-en" aria-pressed="true">EN</button>
      <button id="lang-ja" aria-pressed="false">日本語</button>
      <span class="tag" id="status" style="margin-left:.25rem"></span>
    </div>
  </header>
  <main id="feed"><p class="empty">Loading the journal…</p></main>
  <footer>
    Built for the AWS Weekend Creative Agent Challenge ·
    Amazon Bedrock (Nova Lite) · Lambda · DynamoDB · EventBridge Scheduler · S3 · CloudFront
  </footer>
</div>

<script>
const state = { lang: localStorage.getItem("muse-lang") || "en", data: null, endpoint: null, pref: {} };

// The complete vocabulary. There is no free-text field here on purpose: these
// slugs are the only thing the agent's style memory will accept, so nothing a
// visitor types can ever reach the prompt that writes tomorrow's entry.
const PREFS = [
  ["shorter", "shorter"], ["longer", "longer"],
  ["less_flattery", "no flattery"], ["more_technical", "more technical"],
  ["less_technical", "less jargon"], ["warmer", "warmer"],
  ["drier", "drier"], ["more_specific", "more specific"],
];

const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

function render() {
  const feed = document.getElementById("feed");
  const entries = state.data?.entries ?? [];
  if (!entries.length) {
    feed.innerHTML = '<p class="empty">Nothing written yet. The agent runs tonight.</p>';
    return;
  }
  feed.innerHTML = entries.map((e, i) => {
    const body = state.lang === "ja" ? e.journal_ja : e.journal_en;
    const stats = `${e.stats?.commits ?? 0} commits · ${e.stats?.repos ?? 0} repos`;
    return `<article class="${i === 0 ? "today" : ""}">
      <div class="meta"><span>${esc(e.date)}</span><span>${esc(stats)}</span><span class="mood">${esc(e.mood)}</span></div>
      <h2>${esc(e.title)}</h2>
      <p class="headline">${esc(e.headline)}</p>
      <p class="journal">${esc(body)}</p>
      <div class="tags">${(e.tags || []).map(t => `<span>#${esc(t)}</span>`).join("")}</div>
      <div class="vote" data-date="${esc(e.date)}">
        <button data-vote="up">good read</button>
        <button data-vote="down">not for me</button>
        <span class="label">then, optionally, nudge tomorrow's entry:</span>
        <span class="prefs">${PREFS.map(p =>
          `<button data-pref="${p[0]}">${p[1]}</button>`).join("")}</span>
      </div>
    </article>`;
  }).join("");
}

document.addEventListener("click", async ev => {
  const btn = ev.target.closest("[data-vote], [data-pref]");
  if (!btn || !state.endpoint) return;
  const box = btn.closest(".vote");
  const date = box.dataset.date;

  // A preference on its own still needs a vote to travel with; remember the last
  // one this reader gave for this entry, and default to a thumbs up.
  const vote = btn.dataset.vote || state.pref[date] || "up";
  if (btn.dataset.vote) state.pref[date] = btn.dataset.vote;

  box.querySelectorAll("button").forEach(b => (b.disabled = true));
  try {
    const r = await fetch(state.endpoint, {
      method: "POST",
      headers: { "content-type": "application/json" },
      body: JSON.stringify({ date, vote, pref: btn.dataset.pref || "" }),
    });
    if (!r.ok) throw new Error(String(r.status));
    box.innerHTML = '<span class="said">noted — tomorrow\'s entry will take it into account.</span>';
  } catch {
    box.innerHTML = '<span class="said">could not send that. try again later.</span>';
  }
});

for (const lang of ["en", "ja"]) {
  document.getElementById(`lang-${lang}`).addEventListener("click", () => {
    state.lang = lang;
    localStorage.setItem("muse-lang", lang);
    document.getElementById("lang-en").setAttribute("aria-pressed", String(lang === "en"));
    document.getElementById("lang-ja").setAttribute("aria-pressed", String(lang === "ja"));
    render();
  });
}
document.getElementById(`lang-${state.lang}`)?.click();

Promise.all([
  fetch("data/entries.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null),
  fetch("config.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null).catch(() => null),
]).then(([data, config]) => {
  state.data = data;
  state.endpoint = config?.feedbackEndpoint ?? null;
  document.getElementById("status").textContent =
    data?.generated_at ? "last run " + data.generated_at.slice(0, 16).replace("T", " ") : "";
  render();
});
</script>
</body>
</html>
